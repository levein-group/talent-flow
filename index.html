  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

size:13px;color:#44514E;min-width:0\">{{ x.hm }}<\u002Fdiv>\n      <div style=\"min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px\"><span style=\"font-size:11.5px;font-weight:700;background:{{ x.chipBg }};color:{{ x.chipC }};border-radius:99px;padding:4px 10px;white-space:nowrap\">{{ x.status }}<\u002Fspan><sc-if value=\"{{ x.hasHealth }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10.5px;font-weight:700;background:{{ x.healthBg }};color:{{ x.healthC }};border-radius:99px;padding:3px 8px;white-space:nowrap\">{{ x.healthLabel }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <div style=\"font-size:12.5px;font-weight:700;color:{{ x.daysC }};white-space:nowrap\">{{ x.days }}<\u002Fdiv>\n      <div style=\"position:relative\">\n        <div sc-camel-on-click=\"{{ x.onMenu }}\" style=\"width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#66726E;cursor:pointer;font-size:15px;font-weight:800;line-height:1\" style-hover=\"background:#EDF3F1;color:#326262\">⋯<\u002Fdiv>\n        <sc-if value=\"{{ x.menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;top:{{ x.menuTop }};bottom:{{ x.menuBottom }};right:0;z-index:20;background:#fff;border:1px solid #E4E9E7;border-radius:10px;box-shadow:0 8px 24px rgba(31,42,42,.14);padding:5px;min-width:158px\">\n          <div sc-camel-on-click=\"{{ x.onEdit }}\" style=\"padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#F2F7F5\">Edit role details<\u002Fdiv><div sc-camel-on-click=\"{{ x.onCopy }}\" style=\"padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#F2F7F5\">Copy job URL<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ x.onDup }}\" style=\"padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#F2F7F5\">Duplicate role<\u002Fdiv>\n          <sc-if value=\"{{ reqArchiveTab }}\" hint-placeholder-val=\"{{ false }}\"><div sc-camel-on-click=\"{{ x.onToggleHist }}\" style=\"padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap\" style-hover=\"background:#F2F7F5\">View history<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ x.histOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:6px 18px 14px 18px;border-bottom:1px solid #F3F6F4;background:#FAFCFB\">\n      <div style=\"font-size:10.5px;font-weight:700;letter-spacing:.05em;color:#66726E;margin:6px 0 6px\">HISTORY<\u002Fdiv>\n      <sc-for list=\"{{ x.history }}\" as=\"h\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:10px;padding:5px 0;font-size:12px\"><span style=\"color:#66726E;white-space:nowrap\">{{ h.t }}<\u002Fspan><span style=\"color:#1F2A2A\">{{ h.act }}<\u002Fspan><span style=\"color:#66726E\">— {{ h.actor }}<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ x.histEmpty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:12px;color:#66726E;padding:4px 0\">No status history recorded.<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ reqsNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px dashed #C9D6D1;border-radius:14px;padding:44px 32px;text-align:center;font-size:13.5px;color:#6B7774\">{{ reqsNoMatchMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ rCreateRole }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Create job role\" style=\"animation:tfFade .25s ease\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap\">\n      <div><h1 style=\"margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em\">{{ nrHeading }}<\u002Fh1><div style=\"font-size:13px;color:#6B7774;margin-top:4px\">{{ nrSubtitle }}<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:10px\">\n        <button sc-camel-on-click=\"{{ nrCancel }}\" style=\"background:#fff;border:1px solid #DCE3E0;color:#1F2A2A;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#F2F7F5\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nrSubmit }}\" style=\"background:#326262;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#234A4A\">{{ nrSubmitLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start\">\n      <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(31,42,42,.03)\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:.08em;color:#66726E;margin-bottom:14px\">JOB DESCRIPTION<\u002Fdiv>\n        <div style=\"background:#FBFCFC;border:1px solid #EDF1EF;border-radius:10px;padding:12px;margin-bottom:14px\">\n          <label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:4px\">Original JD as received<\u002Flabel>\n          <div style=\"font-size:11.5px;color:#66726E;line-height:1.5;margin-bottom:10px\">Attach the document the client or hiring manager sent. PDF, DOC, DOCX or TXT.<\u002Fdiv>\n          <sc-if value=\"{{ nrHasJdFile }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #DCE3E0;border-radius:9px;padding:10px 12px\">\n            <span style=\"width:30px;height:30px;border-radius:7px;background:#E8F0EE;color:#234A4A;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none\">{{ nrJdFileExt }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-size:12.5px;font-weight:700;color:#1F2A2A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ nrJdFileName }}<\u002Fdiv><div style=\"font-size:11px;color:#66726E\">{{ nrJdFileMeta }}<\u002Fdiv><\u002Fdiv>\n            <div sc-camel-on-click=\"{{ nrRemoveJdFile }}\" style=\"flex:none;font-size:12px;font-weight:700;color:#9A392F;cursor:pointer\">Remove<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ nrNoJdFile }}\" hint-placeholder-val=\"{{ true }}\">\n          <label style=\"display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed #C9D6D1;border-radius:9px;padding:16px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:700;color:#326262\" style-hover=\"background:#F2F7F5;border-color:#326262\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#326262\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 16V4\"><\u002Fpath><path d=\"M7.5 8.5L12 4l4.5 4.5\"><\u002Fpath><path d=\"M4 16v3.5h16V16\"><\u002Fpath><\u002Fsvg>\n            Upload document\n            <input type=\"file\" accept=\".pdf,.doc,.docx,.txt,.rtf\" sc-camel-on-change=\"{{ onNrJdFile }}\" style=\"display:none\">\n          <\u002Flabel>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Start from a template<\u002Flabel>\n          <sc-raw-select value=\"{{ nrTplId }}\" sc-camel-on-change=\"{{ onNrTpl }}\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:13.5px;font-weight:600;background-color:#fff;color:#1F2A2A;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\">\n            <option value=\"\">Blank role<\u002Foption>\n            <sc-for list=\"{{ tplOpts }}\" as=\"tp\" hint-placeholder-count=\"4\"><option value=\"{{ tp.id }}\">{{ tp.name }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:14px\"><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Role title<\u002Flabel><input value=\"{{ nrTitle }}\" sc-camel-on-change=\"{{ onNrTitle }}\" placeholder=\"e.g. Full-Stack Developer\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:14px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\"><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px\">\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Department<\u002Flabel><input value=\"{{ nrDept }}\" sc-camel-on-change=\"{{ onNrDept }}\" placeholder=\"e.g. Engineering\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:14px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Client details<\u002Flabel><input value=\"{{ nrClient }}\" sc-camel-on-change=\"{{ onNrClient }}\" placeholder=\"e.g. Nova Fintech\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:14px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px\">\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Location<\u002Flabel><input value=\"{{ nrLocation }}\" sc-camel-on-change=\"{{ onNrLocation }}\" placeholder=\"e.g. Remote (Colombo, Sri Lanka)\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:13.5px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Experience level<\u002Flabel><input value=\"{{ nrExpLevel }}\" sc-camel-on-change=\"{{ onNrExpLevel }}\" placeholder=\"e.g. 2-4 years\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:13.5px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px\">\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Contract type<\u002Flabel><sc-raw-select value=\"{{ nrContractType }}\" sc-camel-on-change=\"{{ onNrContractType }}\" style=\"box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #DCE3E0;border-radius:8px;font-size:13.5px;font-weight:600;background-color:#fff;color:#1F2A2A;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\"><option>Permanent - Full time<\u002Foption><option>Permanent - Part time<\u002Foption><option>Contract - Full time<\u002Foption><option>Contract - Part time<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n          <div><label style=\"display:block;font-size:12.5px;font-weight:700;color:#44514E;margin-bottom:6px\">Closing date<\u002Flabel><input value=\"{{ nrClosingDate }}\" placeholder=\"e.g. 30 Sep 2026\" sc-camel-on-change=\"{ n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#66726E\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"position:absolute;left:11px;top:10px\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M16.5 16.5L21 21\"><\u002Fpath><\u002Fsvg>\n        <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"Search name, skill or client\" style=\"width:100%;box-sizing:border-box;padding:8px 12px 8px 32px;border:1px solid #DCE3E0;border-radius:8px;font-size:13px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;box-shadow:0 0 0 3px rgba(50,98,98,.14);outline:none\">\n      <\u002Fdiv>\n      <sc-raw-select value=\"{{ fSource }}\" sc-camel-on-change=\"{{ onSrc }}\" style=\"flex:none;padding:8px 10px;border:1px solid #DCE3E0;border-radius:8px;font-size:12.5px;font-weight:600;background-color:#fff;color:#44514E;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\">\n        <option value=\"All\">All sources<\u002Foption><option value=\"Careers page\">Careers page<\u002Foption><option value=\"Email inbox\">Email inbox<\u002Foption><option value=\"Database import\">Database import<\u002Foption><option value=\"Referral\">Referral<\u002Foption>\n      <\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ fClient }}\" sc-camel-on-change=\"{{ onFClient }}\" style=\"flex:none;padding:8px 10px;border:1px solid #DCE3E0;border-radius:8px;font-size:12.5px;font-weight:600;background-color:#fff;color:#44514E;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\">\n        <sc-for list=\"{{ fClientOpts }}\" as=\"fc\" hint-placeholder-count=\"4\"><option value=\"{{ fc }}\">{{ fc }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-r t-size:18px;font-weight:800;flex:none\">{{ cd.init }}<\u002Fdiv>\n    <div style=\"flex:1;min-width:220px\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><div style=\"font-size:19px;font-weight:800\">{{ cd.name }}<\u002Fdiv><span style=\"font-size:11.5px;font-weight:700;background:{{ cd.stBg }};color:{{ cd.stC }};border-radius:99px;padding:4px 10px\">{{ cd.stage }}<\u002Fspan><span sc-camel-on-click=\"{{ cd.onToggleConsent }}\" style=\"font-size:11.5px;font-weight:700;background:{{ cd.coBg }};color:{{ cd.coC }};border-radius:99px;padding:4px 10px;cursor:pointer\" style-hover=\"opacity:.85\">{{ cd.consent }}<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:12.5px;color:#6B7774;margin-top:5px\">{{ cd.role }} · applied {{ cd.applied }} · via {{ cd.source }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:center;padding:0 8px\">\n      <div style=\"font-size:30px;font-weight:800;color:{{ cd.bC }};line-height:1\">{{ cd.score }}<\u002Fdiv>\n      <div style=\"font-size:10.5px;font-weight:700;color:#66726E;letter-spacing:.06em;margin-top:3px\">{{ scoreLabel }}<\u002Fdiv>\n      <sc-if value=\"{{ scoreModified }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;gap:6px;justify-content:center;margin-top:5px\">\n        <span style=\"font-size:10px;font-weight:800;background:#FBF0DC;color:#7C5612;border-radius:99px;padding:3px 8px\">MODIFIED<\u002Fspan>\n        <span style=\"font-size:10.5px;color:#66726E\">{{ scoreAiNote }}<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ resetScore }}\" style=\"font-size:10.5px;font-weight:700;color:#326262;cursor:pointer;margin-top:4px\" style-hover=\"color:#234A4A\">Revert to AI score<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:8px;flex:none;flex-wrap:wrap\">\n      <sc-for list=\"{{ cdActions }}\" as=\"ac\" hint-placeholder-count=\"2\">\n      <button sc-camel-on-click=\"{{ ac.onClick }}\" sty ze:13px;font-weight:700\">{{ oa.role }}<sc-if value=\"{{ oa.isCurrent }}\" hint-placeholder-val=\"{{ false }}\"> <span style=\"font-size:10px;font-weight:700;background:#E8F0EE;color:#234A4A;border-radius:99px;padding:2px 7px\">CURRENT<\u002Fspan><\u002Fsc-if><\u002Fdiv><div style=\"font-size:11.5px;color:#66726E;margin-top:1px\">{{ oa.client }} · applied {{ oa.applied }}<\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:11.5px;font-weight:700;background:{{ oa.stBg }};color:{{ oa.stC }};border-radius:99px;padding:3px 9px\">{{ oa.stage }}<\u002Fspan>\n      <span style=\"font-size:12px;font-weight:800;background:{{ oa.bBg }};color:{{ oa.bC }};border-radius:99px;padding:3px 9px;min-width:34px;text-align:center\">{{ oa.score }}<\u002Fspan>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:14px;align-items:start\">\n    <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(31,42,42,.03)\">\n      <div style=\"font-size:14.5px;font-weight:800;margin-bottom:12px\">Parsed CV<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F7FAF9;border:1px solid #E7ECEA;border-radius:10px;padding:10px 12px;margin-bottom:14px\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#326262\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M6 3h8l4 4v14H6V3z\"><\u002Fpath><path d=\"M14 3v4h4\"><\u002Fpath><\u002Fsvg>\n        <div style=\"flex:1 1 140px;font-size:12px;color:#44514E;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ cd.file }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ uploadCV }}\" style=\"background:#fff;border:1px solid #DCE3E0;color:#1F2A2A;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:5px\" style-hover=\"background:#F2F7F5\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M12 20V6\"><\u002Fpath><path d=\"M6 12l6-6 6 6\"><\u002Fpath><\u002Fsvg>Replace CV<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ viewCV }}\" style=\"background:#fff;border:1px solid #DCE3E0;color:#1F2A2A;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none\" style-hover=\"background:#F2F7F5\">View original<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#F2F7F5;border:1px solid #DCE9E4;border-radius:10px;padding:10px 12px;margin-bottom:14px\">\n        <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#326262\" stroke-width=\"1.6\" stroke-linecap=\"round\" style=\"flex:none\"><path d=\"M4 4h11l5 5v11H4V4z\"><\u002Fpath><path d=\"M15 4v5h5\"><\u002Fpath><path d=\"M8 13h8\"><\u002Fpath><path d=\"M8 17h5\"><\u002Fpath><\u002Fsvg>\n        <div style=\"flex:1 1 130px;min-width:0\"><div style=\"font-size:12.5px;font-weight:700\">Client CV<\u002Fdiv><div style=\"font-size:11px;color:#6B7774;line-height:1.4\">Anonymised pack — no contact details or internal notes<\u002Fdiv><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ exportClientCv }}\" style=\"background:#326262;color:#fff;border:none;border-radius:7px;padding:8px 13px;font-size:11.5px;font-weight:700;cursor:pointer;flex:none\" style-hover=\"background:#234A4A\">Export for client<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ cd.fields }}\" as=\"f\" hint-placeholder-count=\"6\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F6F4;min-height:38px;flex-wrap:wrap\">\n        <div style=\"flex:0 0 96px;font-size:12px;font-weight:700;color:#66726E\">{{ f.label }}<\u002Fdiv>\n        <sc-if value=\"{{ f.editing 262;border-radius:7px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;flex:none\" style-hover=\"background:#F2F7F5\">Correct<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ cd.hasLinks }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12px;font-weight:700;color:#66726E;margin:14px 0 8px;letter-spacing:.05em\">LINKS<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px\">\n        <sc-for list=\"{{ cd.links }}\" as=\"lnk\" hint-placeholder-count=\"2\">\n        <a href=\"{{ lnk.url }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#F2F5F4;color:#234A4A;border-radius:99px;padding:6px 12px;text-decoration:none\" style-hover=\"background:#E8F0EE\">\n          <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#326262\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1\"><\u002Fpath><path d=\"M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1\"><\u002Fpath><\u002Fsvg>\n          {{ lnk.label }}\n        <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"font-size:12px;font-weight:700;color:#66726E;margin:14px 0 8px;letter-spacing:.05em\">SKILLS<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px\"><sc-for list=\"{{ cd.skills }}\" as=\"sk\" hint-placeholder-count=\"3\"><span style=\"font-size:12px;font-weight:600;background:#E8F0EE;color:#234A4A;border-radius:99px;padding:5px 11px\">{{ sk }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;margin:0 0 8px\"><div style=\"font-size:12px;font-weight:700;color:#66726E;letter-spacing:.05em\">EXPERIENCE · {{ cd.exp }}<\u002Fdiv><sc-if value=\"{{ cdExpLow }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10.5px;font-weight:700;background:#FBF0DC;color:#7C5612;border-radius:99px;padding:3px 8px\">Dates uncertain<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <sc-for list=\"{{ cd.expRows }}\" as=\"x\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F3F6F4\">\n        <div style=\"width:8px;height:8px;border-radius:50%;background:#B9CFCB;margin-top:5px;flex:none\"><\u002Fdiv>\n        <div style=\"flex:1\"><div style=\"font-size:13px;font-weight:700\">{{ x.t }}<\u002Fdiv><div style=\"font-size:12px;color:#6B7774\">{{ x.co }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-size:11.5px;color:#66726E;flex:none\">{{ x.span }}<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-size:12px;font-weight:700;color:#66726E;margin:14px 0 6px;letter-spacing:.05em\">QUALIFICATIONS &amp; CERTIFICATIONS<\u002Fdiv>\n      <div style=\"font-size:13px;color:#1F2A2A;line-height:1.5\">{{ cd.edu }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(31,42,42,.03)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\">\n          <div style=\"font-size:14.5px;font-weight:800\">AI evaluation<\u002Fdiv>\n          <span style=\"font-size:10.5px;font-weight:700;background:#E8F0EE;color:#234A4A;border-radius:99px;padding:4px 10px\">Advisory — final call is human<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:13px;color:#44514E;line-height:1.6\">{{ cd.summary }}<\u002Fp>\n        <sc-if value=\"{{ critViewing }}\" hint-placeholder-val=\"{{ true }}\">\n        <sc-for list=\"{{ cd.evalRows }}\" as=\"e\" hint-placeholder-count=\"4\">\n        <div style=\"padding:10px 0;border-top:1px solid #F3F6F4\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px\">\n            <div style=\"font-size:13px;font-weight:700;flex:1\">{{ e.crit }}<\u002Fdiv>\n            <span style=\"font-size:10.5px;font-weight:700;color:#66726E\">weight {{ e.w }}<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:800;background:{{ e.chipBg }};color:{{ e.chipC }};border-radius:99px;padding:3px 9px;min-width:32px;text-align:center\">{{ e.score }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"height:5px;background:#F2F5F4;border-radius:99px;overflow:hidden;margin-bottom:7px\"><div style=\"height:100%;width:{{ e.barW }};background:{{ e.bar }};border-radius:99px\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#6B7774;line-height:1.55\">{{ e.note }}<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ critEditing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;color:#66726E;line-height:1.5;margin:10px 0 4px\">Adjust the score for any rubric criterion. The match score is recalculated from the criterion weights.<\u002Fdiv>\n        <sc-for list=\"{{ critDraftRows }}\" as=\"cr\" hint-placeholder-count=\"4\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F3F6F4\">\n          <div style=\"flex:1;min-width:0\"><div style=\"font-size:13px;font-weight:700\">{{ cr.crit }}<\u002Fdiv><div style=\"font-size:11px;color:#66726E;margin-top:1px\">weight {{ cr.w }} · AI scored {{ cr.aiValue }}<\u002Fdiv><\u002Fdiv>\n          <input value=\"{{ cr.value }}\" sc-camel-on-change=\"{{ cr.onChange }}\" style=\"width:62px;flex:none;padding:7px;border:1px solid #DCE3E0;border-radius:8px;font-size:14px;font-weight:800;text-align:center;color:#1F2A2A\" style-focus=\"border-color:#326262;outline:none\">\n        <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;mar { pvNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ rPool }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Talent pool\" style=\"animation:tfFade .25s ease\">\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap\">\n    <div><h1 style=\"margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em\">Talent pool<\u002Fh1><div style=\"font-size:13px;color:#6B7774\">{{ poolN }} {{ poolNoun }} from past decisions, ready to re-approach<\u002Fdiv><\u002Fdiv>\n    <sc-if value=\"{{ poolHasData }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ openBulkRealloc }}\" style=\"background:#326262;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap\" style-hover=\"background:#234A4A\">Reallocate all to a role<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ poolHasData }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(31,42,42,.03);display:grid;gap:12px\">\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap\">\n      <div style=\"position:relative;flex:1 1 240px;min-width:200px\">\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#66726E\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"position:absolute;left:11px;top:10px\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"><\u002Fcircle><path d=\"M16.5 16.5L21 21\"><\u002Fpath><\u002Fsvg>\n        <input value=\"{{ poolQ }}\" sc-camel-on-change=\"{{ onPoolQ }}\" placeholder=\"Search name, skill, role or department\" style=\"width:100%;box-sizing:border-box;padding:8px 12px 8px 32px;border:1px solid #DCE3E0;border-radius:8px;font-size:13px;background:#fff;color:#1F2A2A\" style-focus=\"border-color:#326262;box-shadow:0 0 0 3px rgba(50,98,98,.14);outline:none\">\n      <\u002Fdiv>\n      <sc-raw-select value=\"{{ poolClient }}\" sc-camel-on-change=\"{{ onPoolClient }}\" style=\"flex:none;padding:8px 10px;border:1px solid #DCE3E0;border-radius:8px;font-size:12.5px;font-weight:600;background-color:#fff;color:#44514E;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\">\n        <sc-for list=\"{{ poolClientOpts }}\" as=\"pc\" hint-placeholder-count=\"4\"><option value=\"{{ pc }}\">{{ pc }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ poolRoleF }}\" sc-camel-on-change=\"{{ onPoolRoleF }}\" style=\"flex:none;padding:8px 10px;border:1px solid #DCE3E0;border-radius:8px;font-size:12.5px;font-weight:600;background-color:#fff;color:#44514E;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\">\n        <sc-for list=\"{{ poolRoleOpts }}\" as=\"pr\" hint-placeholder-count=\"4\"><option value=\"{{ pr }}\">{{ pr }}<\u002Foption><\u002Fsc-for>\n      <\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ poolSort }}\" sc-camel-on-change=\"{{ onPoolSort }}\" style=\"flex:none;padding:8px 10px;border:1px solid #DCE3E0;border-radius:8px;font-size:12.5px;font-weight:600;background-color:#fff;color:#44514E;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\">\n        <option value=\"score\">Highest score<\u002Foption><option value=\"recent\">Most recent<\u002Foption><option value=\"name\">Name A–Z<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid #F0F3F1;padding-top:12px\">\n      <span style=\"font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#66726E;text-transform:uppercase;flex:none\">Score<\u002Fspan>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <sc-for list=\"{{ poolBands }}\" as=\"pb\" hint-placeholder-count=\"4\"><button sc-camel-on-click=\"{{ pb.onClick }}\" style=\"font-size:12px;font-weight:700;background:{{ pb.bg }};color:{{ pb.c }};border:1px solid {{ pb.bc }};border-radius:99px;padding:6px 12px;cursor:pointer\">{{ pb.label }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;color:#66726E;font-weight:600;margin-left:auto\">{{ poolCountLabel }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ poolNoMatch }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px dashed #C9D6D1;border-radius:14px;padding:40px 32px;text-align:center;font-size:13.5px;color:#6B7774\">No talent pool candidates match these filters.<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ poolEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:#fff;border:1px dashed #C9D6D1;border-radius:14px;padding:56px 32px;text-align:center\">\n    <div style=\"width:52px;height:52px;border-radius:50%;background:#E8F0EE;display:flex;align-items:center;justify-content:center;margin:0 auto 18px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#326262\" stroke-width=\"1.7\" stroke-linecap=\"round\"><rect x=\"3.5\" y=\"4\" width=\"17\" height=\"4.5\" rx=\"1.2\"><\u002Frect><path d=\"M5.5 8.5V18a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8.5\"><\u002Fpath><path d=\"M10 12.5h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n    <div style=\"font-size:17px;font-weight:800;margin-bottom:6px\">Your talent pool is empty<\u002Fdiv>\n    <p style=\"margin:0 auto 20px;font-size:13.5px;color:#6B7774;max-width:400px;line-height:1.55\">When you reject a candidate who was interviewed and given an offer, they're kept here — so the next matching role starts with a warm list instead of a blank page.<\u002Fp>\n    <button sc-camel-on-click=\"{{ goCands }}\" style=\"background:#326262;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#234A4A\">Browse candidates<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px\">\n    <sc-for list=\"{{ poolRows }}\" as=\"p\" hint-placeholder-count=\"3\">\n    <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(31,42,42,.03)\">\n      <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\">\n        <div style=\"width:38px;height:38px;border-radius:50%;background:{{ p.avBg }};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none\">{{ p.init }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\"><div style=\"font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ p.name }}<\u002Fdiv><div style=\"font-size:11.5px;color:#66726E\">{{ p.role }} · rejected {{ p.rejOn }}<\u002Fdiv><\u002Fdiv>\n        <span style=\"font-size:12px;font-weight:800;background:{{ p.bBg }};color:{{ p.bC }};border-radius:99px;padding:4px 10px;flex:none\">{{ p.score }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px\">\n        <sc-for list=\"{{ p.tags }}\" as=\"tg\" hint-placeholder-count=\"2\"><span style=\"font-size:11px;font-weight:600;background:#F2F5F4;color:#44514E;border-radius:99px;padding:4px 10px\">{{ tg }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ p.onSuggest }}\" style=\"flex:1;background:#326262;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#234A4A\">Reallocate to a role<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ p.onView }}\" style=\"background:#fff;border:1px solid #DCE3E0;color:#1F2A2A;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#F2F7F5\">Profile<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ rSet }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Settings\" style=\"animation:tfFade .25s ease;max-width:760px\">\n  <div style=\"margin-bottom:18px\"><h1 style=\"margin:0 0 4px;font-size:24px;font-weight:800\">Settings<\u002Fh1><div style=\"font-size:13px;color:#6B7774\">Data retention and candidate consent<\u002Fdiv><\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E7ECEA;border-radius:14px;padding:20px;margin-bottom:14px\">\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <div style=\"flex:1\"><div style=\"font-size:14px;font-weight:800\">Data retention<\u002Fdiv><div style=\"font-size:12.5px;color:#6B7774;margin-top:3px;line-height:1.5\">{{ purgeNote }}<\u002Fdiv><div style=\"font-size:11.5px;color:#66726E;margin-top:4px\">Audit log events are retained independently and are not deleted by this purge.<\u002Fdiv><\u002Fdiv>\n      <sc-raw-select value=\"{{ retSel }}\" sc-camel-on-change=\"{{ onRet }}\" style=\"padding:9px 11px;border:1px solid #DCE3E0;border-radius:8px;font-size:13px;font-weight:600;background-color:#fff;cursor:pointer;appearance:none;-webkit-appearance:none;padding-right:28px;background-repeat:no-repeat;background-position:right 8px center\" style-focus=\"border-color:#326262;outline:none\"><option>6 months<\u002Foption><option>12 months<\u002Foption><option>18 months<\u002Foption><option>24 months<\u002Foption><\u002Fsc-raw-select>\n      <button sc-camel-on-click=\"{{ runPurgeBtn }}\ ===hm&&this.isActiveStatus(r.status)).length;\n      return {name:hm,activeJobs,cands:rc.length,interviews:gi('HR Interview'),offers:gi('Proposed'),hires:gi('Hired')}});\n    const stuckScreening=rCands.filter(c=>c.stage==='Start Screening'&&this.daysOf(c.applied)>=7);\n    const awaitingOffer=rCands.filter(c=>c.stage==='Proposed');\n    const delayedJobs=V.repJobs.filter(j=>j.status==='Delayed');\n    const atRiskJobs=V.repJobs.filter(j=>j.status==='At risk');\n    const alerts=[];\n    if(delayedJobs.length)alerts.push({dot:'#B4453A',title:delayedJobs.length+' job'+(delayedJobs.length===1?'':'s')+' open more than 45 days',sub:delayedJobs.map(j=>j.title).join(', '),onClick:V.goReqs});\n    if(atRiskJobs.length)alerts.push({dot:'#C9822E',title:atRiskJobs.length+' job'+(atRiskJobs.length===1?'':'s')+' open 30\\u201345 days',sub:atRiskJobs.map(j=>j.title).join(', '),onClick:V.goReqs});\n    if(stuckScreening.length)alerts.push({dot:'#C9822E',title:stuckScreening.length+' candidate'+(stuckScreening.length===1?'':'s')+' stuck in Start Screening 7+ days',sub:stuckScreening.slice(0,4).map(c=>c.name).join(', '),onClick:V.goPipe});\n    if(awaitingOffer.length)alerts.push({dot:'#C9822E',title:awaitingOffer.length+' candidate'+(awaitingOffer.length===1?'':'s')+' awaiting a client decision after being proposed',sub:awaitingOffer.map(c=>c.name).join(', '),onClick:V.goPipe});\n    V.repAlerts=alerts;V.repAlertsEmpty=alerts.length===0;\n    V.repActivity=S.audit.slice(0,7).map(a=>({t:a.t,actor:a.actor,act:a.act,tgt:a.tgt}));\n    // top AI scores\n    V.repLbRoleOpts=repRolesAll.map(r=>({id:r.id,title:r.title}));\n    V.repLbRole=S.repLbRole;V.onRepLbRole=e=>this.setState({repLbRole:e.target.value});\n    const lbPool=(S.repLbRole==='all'?rCands:rCands.filter(c=>c.rid===S.repLbRole));\n    const scoreBadge=sc=>sc>=80?{bg:'#DFEEE7',c:'#22685A'}:sc>=60?{bg:'#FBF0DC',c:'#7C5612'}:{bg:'#F9E7E4',c:'#B4453A'};\n    const top10=lbPool.slice().sort((a,b)=>b.score-a.score).slice(0,10);\n    V.repLeaderboard=top10.map((c,i)=>{const sb=scoreBadge(c.score);return {rank:i+1,name:c.name,role:this.roleOf(c.rid).title,client:this.roleOf(c.rid).client||'\\u2014',stage:c.stage,stBg:Component.CH[c.stage].bg,stC:Component.CH[c.stage].c,\n      score:c.score,scBg:sb.bg,scC:sb.c,source:c.source,onClick:()=>this.go('candidate',{cand:c.id})}});\n    V.repLbDownload=()=>{\n      const cols=['rank','name','role','client','stage','score','source'];\n      const text=[cols.join(',')].concat(V.repLeaderboard.map(r=>cols.map(c=>('\"'+String(r[c]??'').replace(/\"/g,'\"\"')+'\"')).join(','))).join('\\n');\n      const blob=new Blob([text],{type:'text/csv'});const url=URL.createObjectURL(blob);\n      const a=document.createElement('a');a.href=url;a.download='top-ai-scores.csv';document.body.appendChild(a);a.click();a.remove();\n      setTimeout(()=>URL.revokeObjectURL(url),2000);\n      this.log('Downloaded top AI scores',(S.repLbRole==='all'?'All roles':this.roleOf(S.repLbRole).title),'Reports',{reason:'Export for shortlisting review'});\n      this.say('Top '+V.repLeaderboard.length+' candidates downloaded as CSV.');\n    };\n    return V;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
